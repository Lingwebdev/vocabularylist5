<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit 5 · Music Vocabulary</title>
  <style>
    :root {
      --bg: #f4f6fb; --panel: #fff; --ink: #20283a; --muted: #59657a;
      --line: #dce2ed; --accent: #354fc8; --accent-soft: #eef0ff;
      --shadow: 0 8px 28px rgba(35, 48, 82, .07);
      font-size: 20px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--ink); background: var(--bg); font-size: 1rem;
    }
    .app { display: grid; grid-template-columns: minmax(230px, 16.6667%) 1fr; min-height: 100vh; }
    .sidebar {
      height: 100vh; position: sticky; top: 0; overflow: hidden;
      display: flex; flex-direction: column; background: #fff;
      border-right: 1px solid var(--line);
    }
    .side-head { padding: 24px 16px 16px; border-bottom: 1px solid var(--line); }
    .brand { font-size: 1.25rem; font-weight: 800; letter-spacing: -.3px; }
    .sub { color: var(--muted); font-size: .9rem; margin-top: 7px; }
    .search-wrap { padding: 14px 12px 9px; }
    #search {
      width: 100%; border: 2px solid var(--line); border-radius: 10px;
      padding: 12px; outline: none; font-size: 1rem; min-height: 52px;
    }
    #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .word-count { padding: 0 14px 10px; color: var(--muted); font-size: .85rem; }
    #wordList { overflow-y: auto; padding: 0 8px 16px; }
    .word-item {
      width: 100%; border: 0; background: transparent; text-align: left;
      padding: 12px 10px; margin: 2px 0; border-radius: 8px; cursor: pointer;
      color: #34405a; font-size: 1rem; line-height: 1.35; overflow-wrap: anywhere;
    }
    .word-item:hover { background: #f3f5fb; }
    .word-item.active { color: var(--accent); background: var(--accent-soft); font-weight: 800; }
    .main { min-width: 0; padding: 36px clamp(20px, 4vw, 64px) 64px; }
    .main-inner { max-width: 1250px; margin: 0 auto; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
    .eyebrow { color: var(--accent); font-weight: 800; font-size: .85rem; letter-spacing: 1.2px; text-transform: uppercase; }
    .counter { color: var(--muted); font-size: .9rem; }
    h1 { font-size: clamp(2.5rem, 5vw, 4rem); line-height: 1.12; margin: 0 0 12px; letter-spacing: -1.2px; overflow-wrap: anywhere; }
    .word-intro { color: var(--muted); font-size: 1.1rem; line-height: 1.5; margin-bottom: 28px; }
    .section {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 26px 28px; margin: 18px 0; box-shadow: var(--shadow);
    }
    .section h2 { margin: 0 0 18px; font-size: 1.45rem; line-height: 1.3; letter-spacing: -.2px; }
    .section h2 .num {
      display: inline-grid; place-items: center; width: 32px; height: 32px;
      border-radius: 8px; margin-right: 10px; color: var(--accent);
      background: var(--accent-soft); font-size: .9rem; vertical-align: 2px;
    }
    .meaning-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .show-btn, .small-btn {
      border: 0; border-radius: 9px; background: var(--accent); color: white;
      padding: 12px 18px; cursor: pointer; font-weight: 750; font-size: 1rem;
      min-height: 50px;
    }
    .show-btn:hover, .small-btn:hover { filter: brightness(.94); }
    .meaning { font-size: 1.5rem; font-weight: 750; color: #24335d; line-height: 1.5; }
    .hidden { display: none; }
    .location-list { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill {
      background: #f0f3fa; border: 1px solid #e5e9f2; border-radius: 24px;
      padding: 8px 13px; font-size: .95rem; color: #47536b;
    }
    .text-block { color: #35415a; font-size: 1.15rem; line-height: 1.8; white-space: pre-wrap; }
    .context {
      border-left: 4px solid #cbd3fa; padding: 12px 16px; margin: 10px 0;
      background: #fafbff; border-radius: 0 8px 8px 0; color: #3d4962;
      font-size: 1.05rem; line-height: 1.75;
    }
    .exercise-group { border-top: 1px solid var(--line); padding: 18px 0 4px; }
    .exercise-group:first-of-type { border-top: 0; padding-top: 0; }
    .exercise-title { font-weight: 800; font-size: 1.15rem; margin-bottom: 7px; }
    .exercise-instruction { color: var(--muted); font-size: .95rem; margin-bottom: 14px; line-height: 1.6; }
    .question { padding: 15px 0; border-top: 1px dashed var(--line); }
    .question:first-child { border-top: 0; }
    .q-text { font-size: 1.05rem; line-height: 1.75; }
    .options { color: #4d5a73; font-size: 1rem; line-height: 1.9; margin: 7px 0 9px; }
    .answer-toggle {
      background: transparent; color: var(--accent); border: 0; padding: 6px 0;
      cursor: pointer; font-size: .95rem; font-weight: 800;
    }
    .answer {
      margin-top: 8px; padding: 12px 14px; border-radius: 8px;
      background: #f3f6ff; font-size: 1rem; color: #354263; line-height: 1.75;
    }
    .empty { color: var(--muted); padding: 22px 14px; font-size: 1rem; line-height: 1.6; }
    .footer-note { color: #727e94; font-size: .85rem; text-align: center; padding: 22px 0; }
    @media (max-width: 900px) {
      .app { grid-template-columns: minmax(205px, 28%) 1fr; }
      .main { padding: 28px 20px 48px; }
      .section { padding: 22px; }
    }
    @media (max-width: 650px) {
      :root { font-size: 18px; }
      .app { grid-template-columns: 1fr; }
      .sidebar {
        height: auto; max-height: 42vh; position: relative;
        border-right: 0; border-bottom: 1px solid var(--line);
      }
      .side-head { padding: 15px 14px 10px; }
      .search-wrap { padding: 9px 12px 6px; }
      #wordList { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 3px 6px; }
      .word-item { padding: 9px 8px; }
      .main { padding: 22px 12px 40px; }
      .section { padding: 18px 16px; }
      h1 { font-size: clamp(2.2rem, 11vw, 3.2rem); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="side-head">
        <div class="brand">Unit 5 · Music</div>
        <div class="sub">Vocabulary explorer</div>
      </div>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search words..." autocomplete="off">
      </div>
      <div class="word-count" id="wordCount">Loading vocabulary…</div>
      <nav id="wordList" aria-label="Vocabulary list"></nav>
    </aside>

    <main class="main">
      <div class="main-inner" id="detail">
        <div class="empty">Loading vocabulary data…</div>
      </div>
    </main>
  </div>

<script>
  let vocabularyData = null;
  let selectedIndex = 0;

  const wordList = document.getElementById("wordList");
  const searchInput = document.getElementById("search");
  const wordCount = document.getElementById("wordCount");
  const detail = document.getElementById("detail");

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
  }

  function renderWordList() {
    const query = searchInput.value.trim().toLowerCase();
    const filtered = vocabularyData.vocabulary
      .map((item, index) => ({ item, index }))
      .filter(({ item }) => item.word_or_phrase.toLowerCase().includes(query));

    wordCount.textContent = `${filtered.length} / ${vocabularyData.vocabulary.length} words`;
    wordList.innerHTML = "";
    if (!filtered.length) {
      wordList.innerHTML = '<div class="empty">No matching words.</div>';
      return;
    }
    filtered.forEach(({ item, index }) => {
      const button = document.createElement("button");
      button.className = "word-item" + (index === selectedIndex ? " active" : "");
      button.textContent = item.word_or_phrase;
      button.type = "button";
      button.addEventListener("click", () => {
        selectedIndex = index;
        renderWordList();
        renderDetail();
      });
      wordList.appendChild(button);
    });
  }

  function section(title, number, content) {
    return `<section class="section"><h2><span class="num">${number}</span>${title}</h2>${content}</section>`;
  }

  function renderDetail() {
    const item = vocabularyData.vocabulary[selectedIndex];
    if (!item) return;

    const locations = (item.textbook_locations || []).length
      ? `<div class="location-list">${item.textbook_locations.map(loc =>
          `<span class="pill">Page ${escapeHTML(loc.page)} · ${escapeHTML(loc.section || "")}</span>`
        ).join("")}</div>`
      : `<div class="text-block">No exact occurrence was found in the searchable PDF text.</div>`;

    const contexts = (item.usage_in_context || []).length
      ? item.usage_in_context.map(line => `<div class="context">${escapeHTML(line)}</div>`).join("")
      : `<div class="text-block">No extracted text snippet available.</div>`;

    const meaning = section("Meaning", "1",
      `<div class="meaning-row">
        <button class="show-btn" id="showMeaning" type="button">Show meaning</button>
        <span class="meaning hidden" id="meaningText">${escapeHTML(item.chinese_meaning)}</span>
      </div>`);

    const locationSection = section("Textbook locations", "2", locations);
    const scenarioSection = section("Application scenarios", "3",
      `<div class="text-block">${escapeHTML(item.application_scenarios_in_this_unit || "—")}</div>`);
    const usageSection = section("Usage in the textbook", "4", contexts);
    const formsSection = section("Word forms & related words", "5",
      `<div class="text-block">${escapeHTML(item.word_forms_and_related_words || "—")}</div>`);
    const collocationSection = section("Common phrases & collocations", "6",
      `<div class="text-block">${escapeHTML(item.common_phrases_and_collocations || "—")}</div>`);

    detail.innerHTML = `
      <div class="topline"><div class="eyebrow">Vocabulary · Unit 5</div><div class="counter">${selectedIndex + 1} / ${vocabularyData.vocabulary.length}</div></div>
      <h1>${escapeHTML(item.word_or_phrase)}</h1>
      <div class="word-intro">Explore its textbook context, forms, collocations and practice questions.</div>
      ${meaning}${locationSection}${scenarioSection}${usageSection}${formsSection}${collocationSection}
      ${renderExercises()}
      <div class="footer-note">Based on the Unit 5 · Music textbook vocabulary JSON</div>
    `;

    document.getElementById("showMeaning").addEventListener("click", () => {
      const meaningText = document.getElementById("meaningText");
      const button = document.getElementById("showMeaning");
      const isHidden = meaningText.classList.contains("hidden");
      meaningText.classList.toggle("hidden");
      button.textContent = isHidden ? "Hide meaning" : "Show meaning";
    });

    detail.querySelectorAll(".answer-toggle").forEach(button => {
      button.addEventListener("click", () => {
        const answer = button.nextElementSibling;
        const hidden = answer.classList.contains("hidden");
        answer.classList.toggle("hidden");
        button.textContent = hidden ? "Hide answer" : "Show answer";
      });
    });
  }

  function renderExercises() {
    const groups = vocabularyData.exercises || [];
    if (!groups.length) return "";
    let html = section("Exercises", "7", groups.map((group, gi) => `
      <div class="exercise-group">
        <div class="exercise-title">${escapeHTML(group.id || "")} · ${escapeHTML(group.type || "Practice")}</div>
        <div class="exercise-instruction">${escapeHTML(group.instruction || "")}</div>
        ${(group.questions || []).map((q, qi) => `
          <div class="question">
            <div class="q-text">${gi + 1}.${qi + 1} ${escapeHTML(q.question)}</div>
            ${q.options ? `<div class="options">${q.options.map(escapeHTML).join("　　")}</div>` : ""}
            <button class="answer-toggle" type="button">Show answer</button>
            <div class="answer hidden"><strong>Answer:</strong> ${escapeHTML(q.answer)}${q.explanation ? `<br><strong>Explanation:</strong> ${escapeHTML(q.explanation)}` : ""}</div>
          </div>
        `).join("")}
      </div>
    `).join(""));
    return html;
  }

  searchInput.addEventListener("input", renderWordList);

  fetch("./vocabulary.json")
    .then(response => {
      if (!response.ok) throw new Error("Could not load vocabulary.json");
      return response.json();
    })
    .then(data => {
      if (!Array.isArray(data.vocabulary)) throw new Error("The JSON file has no vocabulary array.");
      vocabularyData = data;
      renderWordList();
      renderDetail();
    })
    .catch(error => {
      wordCount.textContent = "Data loading error";
      detail.innerHTML = `<div class="empty"><strong>Unable to load vocabulary.json.</strong><br>${escapeHTML(error.message)}<br><br>Make sure index.html and vocabulary.json are in the same folder, and run the site through a local web server rather than opening index.html directly.</div>`;
    });
</script>
</body>
</html>
